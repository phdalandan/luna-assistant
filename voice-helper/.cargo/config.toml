# Links the verified full sherpa-onnx libraries, including espeak-ng, from `npm run runtime`
# instead of running sherpa-onnx-sys's build script, which downloads unverified archives.
[target.x86_64-pc-windows-msvc.sherpa-onnx]
rustc-link-lib = [
  "static:-bundle=sherpa-onnx-c-api",
  "static:-bundle=sherpa-onnx-core",
  "static:-bundle=kaldi-decoder-core",
  "static:-bundle=sherpa-onnx-kaldifst-core",
  "static:-bundle=sherpa-onnx-fstfar",
  "static:-bundle=sherpa-onnx-fst",
  "static:-bundle=kaldi-native-fbank-core",
  "static:-bundle=kissfft-float",
  "static:-bundle=piper_phonemize",
  "static:-bundle=espeak-ng",
  "static:-bundle=ucd",
  "static:-bundle=onnxruntime",
  "static:-bundle=ssentencepiece_core",
]

[target.aarch64-apple-darwin.sherpa-onnx]
rustc-link-lib = [
  "static:-bundle=sherpa-onnx-c-api",
  "static:-bundle=sherpa-onnx-core",
  "static:-bundle=kaldi-decoder-core",
  "static:-bundle=sherpa-onnx-kaldifst-core",
  "static:-bundle=sherpa-onnx-fstfar",
  "static:-bundle=sherpa-onnx-fst",
  "static:-bundle=kaldi-native-fbank-core",
  "static:-bundle=kissfft-float",
  "static:-bundle=piper_phonemize",
  "static:-bundle=espeak-ng",
  "static:-bundle=ucd",
  "static:-bundle=onnxruntime",
  "static:-bundle=ssentencepiece_core",
  "dylib=c++",
  "framework=Foundation",
]
