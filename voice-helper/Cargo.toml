[package]
name = "luna-voice"
version = "0.1.0"
description = "Speech synthesis helper for Luna, run as a separate process"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
sherpa-onnx = "=1.13.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
