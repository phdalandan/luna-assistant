[package]
name = "luna"
version = "0.1.0"
description = "Privacy-first local voice assistant for Home Assistant"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "luna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bzip2 = { version = "0.5.2", default-features = false, features = ["libbz2-rs-sys"] }
cpal = "0.18.2"
fs4 = "1.1.0"
futures-util = "0.3.34"
keyring = "4.2.0"
log = "0.4.34"
mdns-sd = "0.21.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
sherpa-onnx = "=1.13.8"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tar = "0.4.46"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-single-instance = "2.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt", "net", "process", "io-util", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["__rustls-tls"] }
tokio-util = "0.7.19"
tts = { version = "0.26.3", default-features = false }
url = "2.5.8"
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
ts-rs = "12.0.1"
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
